; Forza Horizon 2 Extra Options + FH2 Air Ride
; Extra Options v0.3.2 by Arthur (RokkuDayo), compatible with Azimuth 1.0.2 (Forza Horizon 2 only)
; FH2 Air Ride module by Deezogtr, added on top of the Extra Options source.

; INI settings are read at game startup.
; Graphics, camera, and HUD options are configured in-game and saved to FH2_ExtraOptions.dat.
; 0 = off, 1 = on.

[Global]
; Toggles the entire feature set of the mod on or off.
Enabled=1

; 1 = keep the game running when its window loses focus (no pause menu when you tab out).
; Controller and keyboard input still only reach air ride while the game window is focused.
KeepRunningInBackground=0

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but it's vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

[Frontend]
; Places the Cars tab immediately to the right of Home in the pause menu.
; Set to 0 to restore the original tab order. Restart required.
CarsNextToHome=1

; Holding LB/RB for 0.5 seconds repeats menu button taps at this interval.
; Lower is faster. Range: 20-1000 ms; 0 disables turbo. Restart required.
MenuTurboIntervalMs=100

; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the "Get In Car" feature during free-roam.
; You can find it by selecting any car in the "My Cars" section of the pause menu.
GetInCarFromPauseMenu=1

; Adds a combined category after the three original rim categories.
; Adds combined aftermarket and stock-rim library categories without changing the game database.
AllRimsCategory=1

; Enables tabs in the pause menu that require an XBOX Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

[Livery]
; 4096x4096 player livery rendering.
Enable4K=1
; 2 = Vanilla intermediate 2x MSAA; 4 = Enhanced intermediate 4x MSAA.
IntermediateMSAA=4
; 2x supersampling per livery region.
ExtraSupersampling=0

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Autodrive]
; Set a GPS route in free roam, then use the Autodrive binding to have the game drive you there.
; Press it again, use CancelAutodrive, drive manually, pause or arrive to restore player control.
Enabled=1

[Profile]
; Uses the Gamerpic.png beside this INI file as the player's avatar.
; Maximum supported dimensions are 2048x2048 and a maximum file size of 16 MB. Square PNG recommended.
CustomGamerpic=1

[Compatibility]
; Allow user-created content privilege checks locally.
; This has no effect on Mezcal.
DisableParentalLocks=1

; Skips Azimuth's save data blob hash and file size comparisons, and rebuilds missing commit markers at startup.
; You still need to follow Azimuth's custom directory structure, but this should make it easier to add new liveries and vinyls to your save.
; This has no effect on Mezcal.
DisableAzimuthSaveChecksums=1

[Files]
; Loose assets beside the game EXE.
; The priority goes: mediaoverride > mediapc > original media.
; Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml.
; Restart the game after changing files.
EnableMediaOverrides=1


[Bindings]
; Xbox and keyboard bindings can be used together. None disables a binding.

; Xbox: DPadUp/Down/Left/Right, A, B, X, Y, LB, RB, LT, RT, View, Menu, LeftStick, RightStick.
; Xbox combinations use +, for example LB+Y. LS/RS, Back/Start are accepted aliases.

; Keyboard: A-Z, 0-9, F1-F24, arrows, Space, Enter, Escape, Tab, Backspace,
; Insert, Delete, Home, End, PageUp, PageDown, Shift, Ctrl, Alt, or a Windows virtual-key code (0xNN).

AutodriveXbox=DPadDown
AutodriveKeyboard=F2
CancelAutodriveXbox=None
CancelAutodriveKeyboard=None

; Headlights require a single tap.
; Sharing the binding with the roof toggle retains tap/hold behavior.
HeadlightsXbox=RightStick
HeadlightsKeyboard=F3

; Roof toggle requires a 1.5 second long hold while stationary in free roam.
RoofXbox=RightStick
RoofKeyboard=F4

; Signals require a 0.5 second long hold. A single tap retains the vanilla radio action.
SignalLeftXbox=DPadLeft
SignalLeftKeyboard=None
SignalRightXbox=DPadRight
SignalRightKeyboard=None

; Hazards require a single tap.
; Photo Mode requires a 1 second long hold when sharing the same binding.
HazardsXbox=DPadUp
HazardsKeyboard=None
PhotoModeXbox=DPadUp
PhotoModeKeyboard=None
ShowroomPhotoXbox=View
ShowroomPhotoKeyboard=None
; Car Meet car-view Photo Mode has its own binding (View keeps Change Camera).
CarMeetPhotoXbox=X
CarMeetPhotoKeyboard=None
ReturnToGarageXbox=X
ReturnToGarageKeyboard=None
JumpToManufacturerXbox=View
JumpToManufacturerKeyboard=Tab
; Independent binding for rim-style categories; View stays Setup Manager.
RimJumpToManufacturerXbox=Y
RimJumpToManufacturerKeyboard=Tab

; Toggles UI rendering. Opening the pause menu restores it.
ToggleUIXbox=None
ToggleUIKeyboard=F1

[Experiments]
; Uses matching saved designs for a random subset of Drivatars.
; Designs are prepared during native loading waits and reused during driving.
; The cache is refreshed at race/free-roam loading transitions.
; Set to 0 and restart to restore the native livery source.
LocalDrivatarLiveries=1
; Maximum decorated Drivatars and prepared designs: 0-32, default 5.
; Higher values use more memory. Restart after changing this value.
MaxDrivatarLiveries=5

; Allows front and rear aero tuning without Forza race bodywork.
; Set to 0 to restore the original equipment requirements and tuning ranges.
; WARNING: Experimental. Forza aero ranges can change stock PI and handling.
UnlockAeroTuning=0

; Expands engine swaps to the complete engine catalog in a private runtime database.
; Keep enabled while using cars saved with one of the added swaps.
; WARNING: Experimental. Initial load time will be increased and browsing the engine list will feel sluggish.
AllEngineSwaps=0

; Makes the existing gearbox variants available across cars, including donor ratios and gear counts.
; Experimental: increases initial load time and creates a long transmission list.
; Added swaps allow full ratio tuning. Keep enabled while using cars saved with them.
; Restart after changing. Original on-disk databases are not edited.
AllTransmissionSwaps=0

[AirRide]
; Live ride-height control for your own car through the game's native tuning code.
; Heights are percentages of the car's own native ride-height tuning range:
; 0 = the lowest ride height the tuning menu allows, 100 = the highest.
Enabled=1

; 1 = only adjust in free roam (recommended). Car meets are always excluded.
FreeRoamOnly=1

; Adjust only at or below this speed in km/h. 0 = only when stationary.
MaxAdjustSpeedKmh=30

; Smooth travel speed in percent of the range per second, and the faster air-out/air-up speed.
TravelSpeed=35
AirOutSpeed=80

; One button press moves the target by StepPercent. Holding repeats at HoldSpeed percent/s.
StepPercent=2
HoldSpeed=25

; Re-apply the suspension at most once per ApplyIntervalMs while the car is moving to a target.
ApplyIntervalMs=50

; Remember the last stance per car model for this session and restore it on respawn.
RememberStance=1

; EXPERIMENTAL, not tested in game: go below the game's lowest ride height (ExtraDropPercent) or
; above its highest (ExtraLiftPercent) by this percentage of the car's native range (0-100).
; Air-out drops to the lowest allowed height, full lift goes to the highest.
; 0 keeps the game's own limits. Lower these if a car clips into the road or behaves oddly.
ExtraDropPercent=50
ExtraLiftPercent=50

; Stance presets, front/rear percent of the native range. PresetCount = how many are used (0-5).
PresetCount=5
; 1: Slammed
Preset1Front=0
Preset1Rear=0
; 2: Rake
Preset2Front=15
Preset2Rear=30
; 3: Low
Preset3Front=30
Preset3Rear=30
; 4: Mid
Preset4Front=50
Preset4Rear=50
; 5: Lifted
Preset5Front=100
Preset5Rear=100

; Sound effects: air-out blast, vent hiss while lowering, compressor while raising
; (also for full lift and going back to the car's own tune).
; They play through Windows, not the game's audio, so in-game volume sliders do not affect them.
; Put AirRide_AirOut.wav, AirRide_Down.wav or AirRide_Up.wav (16-bit PCM) beside this INI to
; replace the built-in sounds. SoundVolume is 0-100.
Sounds=1
SoundVolume=60

; Keyboard: Windows virtual-key codes (decimal or 0x hex). 0 = unbound.
; Defaults: Home/End front up/down, Page Up/Page Down rear up/down, Insert/Delete both,
; F5 air-out toggle, F6 back to the car's own tune, F8/F7 next/previous preset, F9 full lift.
KeyFrontUp=0x24
KeyFrontDown=0x23
KeyRearUp=0x21
KeyRearDown=0x22
KeyBothUp=0x2D
KeyBothDown=0x2E
KeyAirOut=0x74
KeyStock=0x75
KeyPresetNext=0x77
KeyPresetPrevious=0x76
KeyLift=0x78

; Controller button masks (read from the game's own controller state):
; 0x0001 Up, 0x0002 Down, 0x0004 Left, 0x0008 Right, 0x0010 Start, 0x0020 View/Back,
; 0x0040 LS, 0x0080 RS, 0x0100 LB, 0x0200 RB, 0x1000 A, 0x2000 B, 0x4000 X, 0x8000 Y.
;
; Double-tap controls (LB = L1 on a PlayStation controller):
;   double-tap LB            air out (drop to the lowest height); again: full lift
;   double-tap and hold LB   back to the car's own tuned ride height (hold the second press)
; A single press or a normal hold does nothing, so the button keeps working for driving.
; The game still sees the presses, so whatever LB does in your control layout also happens.
; Put Lower and Raise on different buttons to split them; then double-tap and hold lowers or
; raises smoothly while held. PadDoubleTapStock is an optional separate stock button
; (RB = 0x0200 also changes the camera in game).
; DoubleTapMs = longest tap and longest gap between the two taps (150-1000). 0 = unbound.
PadDoubleTapLower=0x0100
PadDoubleTapRaise=0x0100
PadDoubleTapStock=0
DoubleTapMs=300

; Optional hold-a-modifier combos (off by default: the game also reacts to those buttons).
; Actions work only while every PadModifier button is held. Example: PadModifier=0x0100 with
; PadAirOut=0x4000 is hold LB + X. While a combo modifier is held, Extra Options' D-pad
; blinkers, radio and autodrive stand aside.
PadModifier=0x0100
PadFrontUp=0
PadFrontDown=0
PadRearUp=0
PadRearDown=0
PadBothUp=0
PadBothDown=0
PadAirOut=0
PadStock=0
PadPresetNext=0
PadPresetPrevious=0
PadLift=0
